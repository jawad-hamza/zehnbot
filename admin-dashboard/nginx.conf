# Trust X-Forwarded-For only from the local Docker network (the Caddy TLS proxy),
# so $remote_addr below is the real visitor and cannot be forged from outside.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Keep the scheme reported by the TLS proxy when there is one
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Small JSON bodies everywhere...
    client_max_body_size 256k;

    location = /nginx-health {
        access_log off;
        return 200 "ok";
    }

    # ...except knowledge uploads (10 MB files, large pasted text)
    location ~ ^/api/admin/clients/[^/]+/knowledge {
        client_max_body_size 15M;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_api.conf;
    }

    # ...and launcher pictures (1 MB each, plus the form's envelope)
    location ~ ^/api/admin/clients/[^/]+/launcher/ {
        client_max_body_size 2M;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_api.conf;
    }

    # Streamed chat replies: hand every token to the visitor as it arrives. With buffering on,
    # nginx would collect the whole reply first and the "typing" effect would be lost.
    location = /api/chat/stream {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_api.conf;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_api.conf;
    }

    # The embeddable widget. Short cache so fixes reach customer sites quickly.
    location /static/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_api.conf;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff";
    }

    # Hashed build assets never change
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    }
}
