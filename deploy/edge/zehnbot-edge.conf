# ZehnBot's edge: the only thing on 127.0.0.1:3001, which is the only address the server's own nginx
# talks to. It is not restarted by a deploy. It forwards every request to the production web container,
# and, while production restarts on a new release, to the candidate that is already running that release.
#
# Why this exists: a container's port published on the host is held open by Docker's port proxy until the
# container has fully stopped, so a stopping container ACCEPTS connections and then drops them. nginx
# cannot tell that apart from "the request was received", and it will never resend a POST in that case.
# Inside Docker's own network there is no such proxy: a stopping or stopped container simply refuses
# the connection, the request never arrived, and sending it to the candidate instead is always safe.

# This folder is /opt/zehnbot/edge on the server, mounted read-only into the edge container (the stock
# nginx image). A deploy updates these files and reloads nginx; it never has to replace the container.
# (.inc files are included explicitly below; only *.conf files are loaded automatically.)

# Docker's DNS, re-asked every 2 seconds: containers get a new address each time they are recreated
resolver 127.0.0.11 valid=2s ipv6=off;

# Which web container is preferred. The deploy rewrites this file and reloads the edge (a graceful reload
# never drops a connection): before production is drained it prefers the candidate, and once production is
# healthy again it prefers production.
include /etc/nginx/conf.d/zehnbot-upstream.inc;

# The scheme the visitor used, as reported by the server's nginx
map $http_x_forwarded_proto $zb_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 16m;          # the dashboard's own limit for knowledge uploads is 15 MB

    location = /edge-health {
        access_log off;
        return 200 "ok";
    }

    # Chat replies stream (server-sent events): pass each piece on at once
    location = /api/chat/stream {
        proxy_pass http://zehnbot_web;
        include /etc/nginx/conf.d/zehnbot-edge-proxy.inc;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://zehnbot_web;
        include /etc/nginx/conf.d/zehnbot-edge-proxy.inc;
        proxy_read_timeout 130s;       # AI replies can take a while; the web container itself waits 120s
    }
}
