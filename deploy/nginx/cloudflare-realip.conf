# /etc/nginx/snippets/cloudflare-realip.conf
#
# bot.zehnox.com is proxied by Cloudflare, so without this every request appears to come from a
# Cloudflare edge server. ZehnBot limits several things per visitor address (log-in attempts, chat
# messages, the landing-page demo, contact requests); without the real address, all visitors behind
# one Cloudflare location would share a single allowance.
#
# Trust CF-Connecting-IP ONLY when the connection really comes from Cloudflare. Anyone else can send
# the header, and it is then ignored.
#
# Ranges from https://www.cloudflare.com/ips-v4 and /ips-v6, fetched 2026-09-19. Cloudflare changes them
# rarely; re-check them once in a while.
#
# Included only inside the bot.zehnox.com server block, so no other site on this server is affected.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
