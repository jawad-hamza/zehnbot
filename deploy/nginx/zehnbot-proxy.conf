# /etc/nginx/snippets/zehnbot-proxy.conf: the reverse-proxy settings for bot.zehnox.com.

proxy_http_version 1.1;
proxy_set_header Host $host;
# $remote_addr is the real visitor here (cloudflare-realip.conf restored it). Overwrite, never append:
# a visitor-supplied X-Forwarded-For must never reach ZehnBot's rate limits.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

proxy_connect_timeout 5s;
proxy_send_timeout 140s;
# (proxy_read_timeout is set per location: 140s normally, 300s for streamed chat replies)
