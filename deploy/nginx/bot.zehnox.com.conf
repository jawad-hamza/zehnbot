# What /etc/nginx/sites-available/bot.zehnox.com looks like AFTER the change in DEPLOYMENT.md
# ("Point bot.zehnox.com at ZehnBot"). A reference to compare against, not a file to copy over the
# server's: the certbot-managed lines must stay exactly as certbot wrote them there.
#
# The change: two includes and a size limit added, and the placeholder "location /" replaced by the two
# locations below. Nothing else in the file changes, and no other site on the server is affected.
#
# 127.0.0.1:3001 is ZehnBot's edge, which is never restarted by a deploy: switching releases, and
# sending visitors to the new release while production restarts, all happens behind it.

server {
    server_name bot.zehnox.com;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    # ZehnBot's own limit for knowledge-base uploads is 15 MB; this one sits just above it
    client_max_body_size 16m;

    # Chat replies stream (server-sent events): no buffering, and a long read timeout
    location = /api/chat/stream {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/zehnbot-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/zehnbot-proxy.conf;
        proxy_read_timeout 140s;       # AI replies can take a while; ZehnBot's own proxies wait up to 130s
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bot.zehnox.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bot.zehnox.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = bot.zehnox.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name bot.zehnox.com;
    return 404; # managed by Certbot
}
